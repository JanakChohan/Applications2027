<title>Outreach Tracker — Speculative Internship</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#f7f8fa;--panel:#fff;--panel-2:#f1f3f7;--ink:#18202e;--ink-soft:#4a5568;--muted:#71809a;
  --line:#e2e6ee;--line-strong:#cdd4e0;--accent:#1f4e6b;--accent-soft:#2c6f96;--focus:#2c6f96;
  --s-bg:#f5e6c8;--s-fg:#7a5410;--s-line:#e2c684;--a-bg:#d5ebe6;--a-fg:#1c5c50;--a-line:#a9d6cc;
  --b-bg:#dde6f3;--b-fg:#294a77;--b-line:#bcccea;--c-bg:#e7e9ee;--c-fg:#4f5a6b;--c-line:#d0d5de;
  --go:#1f9d55;--go-bg:#e4f5ec;--go-line:#a9dcc0;--due:#c2410c;--due-bg:#fbeadf;--due-line:#f0c3a3;
  --lock:#8b97a8;--shadow:0 1px 2px rgba(20,30,50,.05),0 8px 24px rgba(20,30,50,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e131b;--panel:#161d28;--panel-2:#1c2531;--ink:#e8ecf3;--ink-soft:#b3bece;--muted:#8593a8;
  --line:#26303e;--line-strong:#33404f;--accent:#7fc3e6;--accent-soft:#5fa9d2;--focus:#5fa9d2;
  --s-bg:#3a3016;--s-fg:#f0d18a;--s-line:#5c4c22;--a-bg:#173630;--a-fg:#8fd8c8;--a-line:#265046;
  --b-bg:#1b2a44;--b-fg:#a9c4ee;--b-line:#2c4067;--c-bg:#232b38;--c-fg:#aeb9c9;--c-line:#333e4d;
  --go:#4cc47f;--go-bg:#123024;--go-line:#1e5540;--due:#f0955a;--due-bg:#37210f;--due-line:#5e3b1e;
  --lock:#66717f;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="light"]{--bg:#f7f8fa;--panel:#fff;--panel-2:#f1f3f7;--ink:#18202e;--ink-soft:#4a5568;--muted:#71809a;--line:#e2e6ee;--line-strong:#cdd4e0;--accent:#1f4e6b;--accent-soft:#2c6f96;--focus:#2c6f96;--s-bg:#f5e6c8;--s-fg:#7a5410;--s-line:#e2c684;--a-bg:#d5ebe6;--a-fg:#1c5c50;--a-line:#a9d6cc;--b-bg:#dde6f3;--b-fg:#294a77;--b-line:#bcccea;--c-bg:#e7e9ee;--c-fg:#4f5a6b;--c-line:#d0d5de;--go:#1f9d55;--go-bg:#e4f5ec;--go-line:#a9dcc0;--due:#c2410c;--due-bg:#fbeadf;--due-line:#f0c3a3;--lock:#8b97a8;}
:root[data-theme="dark"]{--bg:#0e131b;--panel:#161d28;--panel-2:#1c2531;--ink:#e8ecf3;--ink-soft:#b3bece;--muted:#8593a8;--line:#26303e;--line-strong:#33404f;--accent:#7fc3e6;--accent-soft:#5fa9d2;--focus:#5fa9d2;--s-bg:#3a3016;--s-fg:#f0d18a;--s-line:#5c4c22;--a-bg:#173630;--a-fg:#8fd8c8;--a-line:#265046;--b-bg:#1b2a44;--b-fg:#a9c4ee;--b-line:#2c4067;--c-bg:#232b38;--c-fg:#aeb9c9;--c-line:#333e4d;--go:#4cc47f;--go-bg:#123024;--go-line:#1e5540;--due:#f0955a;--due-bg:#37210f;--due-line:#5e3b1e;--lock:#66717f;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px;}
h1{font-size:21px;font-weight:650;margin:0 0 2px;letter-spacing:-.01em;}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px;}
/* dashboard */
.dash{position:sticky;top:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:16px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:left;}
.tile .n{font-size:20px;font-weight:660;}
.tile .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:1px;line-height:1.25;}
.tile.due{background:var(--due-bg);border-color:var(--due-line);}
.tile.due .n{color:var(--due);} .tile.due .l{color:var(--due);}
.tile.ok .n{color:var(--go);}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;}
.seg{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;}
.seg button{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-size:12.5px;font-weight:550;padding:5px 11px;border-radius:7px;cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;}
.btn{cursor:pointer;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-soft);border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:550;}
.btn:hover{border-color:var(--accent-soft);color:var(--ink);}
.btn.due{background:var(--due-bg);border-color:var(--due-line);color:var(--due);}
.btn.due[aria-pressed="true"]{background:var(--due);color:#fff;}
.senderwrap{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--muted);font-size:12px;}
.senderwrap input{background:var(--panel-2);border:1px solid var(--line-strong);border-radius:7px;color:var(--ink);padding:6px 9px;font:inherit;font-size:12.5px;width:150px;}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
/* groups + cards */
.group-h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650;margin:22px 4px 10px;display:flex;align-items:center;gap:8px;}
.group-h .cnt{color:var(--ink-soft);}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;}
.card.replied{border-color:var(--go-line);}
.card.closed{opacity:.72;}
.card.flag{border-color:var(--due-line);}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.cname{font-weight:650;font-size:15px;line-height:1.25;}
.cmeta{color:var(--muted);font-size:12px;margin-top:1px;}
.tier{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:21px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid;}
.tier.S{background:var(--s-bg);color:var(--s-fg);border-color:var(--s-line);}
.tier.A{background:var(--a-bg);color:var(--a-fg);border-color:var(--a-line);}
.tier.B{background:var(--b-bg);color:var(--b-fg);border-color:var(--b-line);}
.tier.C{background:var(--c-bg);color:var(--c-fg);border-color:var(--c-line);}
.diff{font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-radius:8px;padding:8px 10px;}
.contact{font-size:13px;}
.contact .nm{font-weight:600;}
.contact .ti{color:var(--muted);}
.emailrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;}
.emailrow .cdot{width:8px;height:8px;border-radius:50%;flex:none;}
.cdot.published{background:var(--go);}.cdot.inferred{background:#d9971f;}.cdot.generic{background:var(--lock);}.cdot.none{background:transparent;border:1px solid var(--line-strong);}
.mini{cursor:pointer;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-soft);border-radius:6px;padding:3px 8px;font:inherit;font-size:11.5px;}
.mini:hover{border-color:var(--accent-soft);color:var(--ink);}
.others{font-size:11.5px;color:var(--muted);}
.seq{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:10px;}
.step{display:flex;align-items:center;gap:8px;}
.step .lab{font-size:11px;color:var(--muted);width:16px;flex:none;text-align:center;font-weight:700;}
.sendbtn{flex:1;text-align:left;cursor:pointer;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 11px;font:inherit;font-size:12.5px;font-weight:560;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.sendbtn:hover:not(:disabled){border-color:var(--accent-soft);}
.sendbtn .when{font-size:11px;font-weight:500;color:var(--muted);}
.sendbtn.sent{background:var(--go-bg);border-color:var(--go-line);color:var(--go);}
.sendbtn.due{background:var(--due-bg);border-color:var(--due-line);color:var(--due);}
.sendbtn.due .when{color:var(--due);}
.sendbtn:disabled{opacity:.55;cursor:not-allowed;}
.sendbtn.locked{background:var(--panel-2);color:var(--lock);cursor:not-allowed;}
.copybtn{flex:none;}
.undo{background:none;border:0;color:var(--accent-soft);font:inherit;font-size:11px;cursor:pointer;padding:2px 4px;text-decoration:underline;}
.override{font-size:11px;margin-left:24px;margin-top:-3px;}
.override a{color:var(--accent-soft);cursor:pointer;text-decoration:underline;}
.foot{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:9px;flex-wrap:wrap;}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;user-select:none;}
.chk input{width:15px;height:15px;accent-color:var(--accent);}
.flagmsg{background:var(--due-bg);border:1px solid var(--due-line);color:var(--due);border-radius:8px;padding:7px 10px;font-size:12px;}
.collapsed .diff,.collapsed .contact,.collapsed .emailrow,.collapsed .others,.collapsed .seq,.collapsed .override,.collapsed .flagmsg{display:none;}
.collapsed .foot{border-top:0;padding-top:0;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
.toast.show{opacity:1;}
.empty{color:var(--muted);font-size:13px;padding:8px 4px;}
@media(max-width:560px){.cards{grid-template-columns:1fr;}.senderwrap{margin-left:0;width:100%;}}
</style>

<div class="wrap">
  <h1>Outreach Tracker</h1>
  <p class="sub">Speculative internship sequence — initial email, then follow-up 1 (+7 days), then follow-up 2 (+7 days, and no more). Everything saves in your browser automatically.</p>

  <div class="dash">
    <div class="tiles" id="tiles"></div>
    <div class="toolbar">
      <div class="seg" id="tierseg" role="group" aria-label="Filter by tier">
        <button data-tier="all" aria-pressed="true">All</button>
        <button data-tier="S" aria-pressed="false">S</button>
        <button data-tier="A" aria-pressed="false">A</button>
        <button data-tier="B" aria-pressed="false">B</button>
        <button data-tier="C" aria-pressed="false">C</button>
      </div>
      <button class="btn due" id="duefilter" aria-pressed="false">Show only: due now</button>
      <label class="chk" style="font-size:12px"><input type="checkbox" id="hideclosed"> Hide closed</label>
      <button class="btn" id="exportbtn">Export progress</button>
      <button class="btn" id="importbtn">Import</button>
      <input type="file" id="importfile" accept=".csv,text/csv" hidden>
      <span class="senderwrap">Sign as <input id="sender" type="text" placeholder="Your name"></span>
    </div>
  </div>

  <div id="groups"></div>
</div>
<div class="toast" id="toast"></div>

const DEFAULT_SENDER = "Janak Chohan";
const GATE = 7;
const SKEY = "outreach_state_v1";
const NKEY = "outreach_sender_v1";
const TIERS = ["S","A","B","C"];
const TIERLABEL = {S:"S — boutique IB / corporate finance / PE / VC",A:"A — wealth / IFA / investment",B:"B — accountancy / audit / insurance / fintech",C:"C — professional services w/ finance function"};

let STATE = load();
let sender = localStorage.getItem(NKEY) || DEFAULT_SENDER;
let filterTier = "all", filterDue = false, hideClosed = false;

function load(){ try{return JSON.parse(localStorage.getItem(SKEY))||{};}catch(e){return {};} }
function save(){ localStorage.setItem(SKEY, JSON.stringify(STATE)); }
function st(name){ if(!STATE[name]) STATE[name]={i:{s:false,d:null},f1:{s:false,d:null},f2:{s:false,d:null},replied:false,closed:false}; return STATE[name]; }
function today(){ const n=new Date(); const p=x=>String(x).padStart(2,"0"); return n.getFullYear()+"-"+p(n.getMonth()+1)+"-"+p(n.getDate()); }
function daysSince(d){ if(!d) return null; const a=new Date(d+"T00:00:00"); const n=new Date(); const t=new Date(n.getFullYear(),n.getMonth(),n.getDate()); return Math.floor((t-a)/86400000); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function subjectFor(step){ const base="Speculative internship enquiry — "+sender; return step==="i"?base:("Re: "+base); }
function bodyFor(f,step){ const raw = step==="i"?f.body : step==="f1"?f.fu1 : f.fu2; return raw + sender; }
function compose(f,step){
  const url="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(f.email)+"&su="+encodeURIComponent(subjectFor(step))+"&body="+encodeURIComponent(bodyFor(f,step));
  window.open(url,"_blank","noopener");
}
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
function copy(text,msg){ navigator.clipboard.writeText(text).then(()=>toast(msg||"Copied")).catch(()=>toast("Copy failed — select manually")); }

function send(name,step){ const s=st(name); const slot=step==="i"?s.i:step==="f1"?s.f1:s.f2; const f=FIRMS.find(x=>x.company===name); compose(f,step); slot.s=true; slot.d=today(); save(); render(); }
function undo(name,step){ const s=st(name); (step==="i"?s.i:step==="f1"?s.f1:s.f2).s=false; (step==="i"?s.i:step==="f1"?s.f1:s.f2).d=null; save(); render(); }

// status helpers for a firm
function firmStatus(f){
  const s=st(f.company);
  if(f.no_email) return "flag";
  if(s.closed) return "closed";
  if(s.replied) return "replied";
  if(!s.i.s) return "new";
  if(!s.f1.s){ return daysSince(s.i.d)>=GATE?"f1due":"await1"; }
  if(!s.f2.s){ return daysSince(s.f1.d)>=GATE?"f2due":"await2"; }
  return "done2";
}

function counts(){
  const c={new:0,await1:0,f1due:0,await2:0,f2due:0,replied:0,closed:0,noemail:0};
  FIRMS.forEach(f=>{ const s=st(f.company);
    if(f.no_email) c.noemail++;
    if(s.closed){c.closed++; return;}
    if(s.replied){c.replied++; return;}
    if(!s.i.s){ if(!f.no_email) c.new++; return; }
    if(!s.f1.s){ daysSince(s.i.d)>=GATE?c.f1due++:c.await1++; return; }
    if(!s.f2.s){ daysSince(s.f1.d)>=GATE?c.f2due++:c.await2++; return; }
  });
  return c;
}

function renderTiles(){
  const c=counts();
  const tiles=[
    {n:c.new,l:"Not yet contacted"},
    {n:c.await1,l:"Awaiting follow-up 1"},
    {n:c.f1due,l:"Follow-up 1 DUE NOW",cls:"due"},
    {n:c.await2,l:"Awaiting follow-up 2"},
    {n:c.f2due,l:"Follow-up 2 DUE NOW",cls:"due"},
    {n:c.replied,l:"Replied",cls:"ok"},
    {n:c.closed,l:"Closed / done"},
  ];
  document.getElementById("tiles").innerHTML=tiles.map(t=>
    `<div class="tile ${t.cls&&t.n>0?t.cls:""}"><div class="n mono">${t.n}</div><div class="l">${t.l}</div></div>`).join("");
}

function stepRow(f,step,label){
  const s=st(f.company); const name=f.company;
  const slot=step==="i"?s.i:step==="f1"?s.f1:s.f2;
  const prevSent = step==="i"?true : step==="f1"?s.i.s : s.f1.s;
  const gateFrom = step==="f1"?s.i.d : step==="f2"?s.f1.d : null;
  const closedOut = s.replied || s.closed;
  const lab = step==="i"?"1":step==="f1"?"2":"3";
  let cls="sendbtn", right="", disabled=false, onclick=`send('${jsq(name)}','${step}')`, override="";
  if(f.no_email){ cls+=" locked"; disabled=true; right='<span class="when">no email on file</span>'; }
  else if(slot.s){ cls+=" sent"; right=`<span class="when">sent ${slot.d}</span>`; onclick=""; }
  else if(!prevSent){ cls+=" locked"; disabled=true; right=`<span class="when">unlocks after step ${lab==='2'?'1':'2'}</span>`; }
  else if(closedOut){ cls+=" locked"; disabled=true; right='<span class="when">sequence closed</span>'; }
  else {
    const ds=daysSince(gateFrom); const left=GATE-ds;
    if(step==="i"){ right='<span class="when">ready</span>'; }
    else if(ds>=GATE){ cls+=" due"; right=`<span class="when">due now · ${ds}d since prev</span>`; }
    else { cls+=" locked"; disabled=true; right=`<span class="when">in ${left} day${left===1?"":"s"}</span>`;
           override=`<div class="override" data-idx><a onclick="send('${jsq(name)}','${step}')">override — send anyway now</a></div>`; }
  }
  const btn=`<button class="${cls}" ${disabled?"disabled":""} ${onclick&&!disabled?`onclick="${onclick}"`:""}><span>${label}</span>${right}</button>`;
  const copyb=`<button class="mini copybtn" onclick="copyBody('${jsq(name)}','${step}')" ${f.no_email?"disabled":""}>Copy body</button>`;
  const undob=slot.s?`<button class="undo" onclick="undo('${jsq(name)}','${step}')">undo</button>`:"";
  return `<div class="step"><span class="lab">${lab}</span>${btn}${copyb}${undob}</div>${override}`;
}
function jsq(s){ return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
window.copyBody=function(name,step){ const f=FIRMS.find(x=>x.company===name); copy(bodyFor(f,step),"Email body copied"); };
window.send=send; window.undo=undo;

function card(f){
  const s=st(f.company); const status=firmStatus(f);
  const cls=["card"]; if(s.replied)cls.push("replied"); if(s.closed)cls.push("closed collapsed"); if(f.no_email)cls.push("flag");
  const conf=["published","inferred","generic"].includes(f.email_confidence)?f.email_confidence:"none";
  const emailHtml = f.no_email
    ? `<div class="flagmsg">No email address on file for this firm — add one in targets.csv, then re-generate. Send buttons are disabled.</div>`
    : `<div class="emailrow"><span class="cdot ${conf}"></span><span class="mono">${esc(f.email)}</span><button class="mini" onclick="copy(${JSON.stringify(f.email)},'Email copied')">Copy email</button><span style="color:var(--muted)">(${f.email_confidence||"?"})</span></div>`;
  const others = f.others.length?`<div class="others">Also at this firm: ${f.others.map(o=>esc(o.name)+(o.title?` (${esc(o.title)})`:"")).join(" · ")}</div>`:"";
  const contactLine = f.contact_name.trim()
    ? `<div class="contact"><span class="nm">${esc(f.contact_name)}</span>${f.contact_title?` <span class="ti">— ${esc(f.contact_title)}</span>`:""}</div>`
    : `<div class="contact"><span class="ti">No named contact — email addressed "Dear Sir/Madam"</span></div>`;
  return `<div class="${cls.join(" ")}" data-tier="${f.tier}" data-status="${status}">
    <div class="chead"><div><div class="cname">${esc(f.company)}</div><div class="cmeta">${esc(f.town)}</div></div><span class="tier ${f.tier}">${f.tier}</span></div>
    <div class="diff">${esc(f.hook)||"<span style='color:var(--muted)'>No differentiator note on file.</span>"}</div>
    ${contactLine}
    ${emailHtml}
    ${others}
    <div class="seq">
      ${stepRow(f,"i","Send initial email")}
      ${stepRow(f,"f1","Send follow-up 1")}
      ${stepRow(f,"f2","Send follow-up 2")}
    </div>
    <div class="foot">
      <label class="chk"><input type="checkbox" ${s.replied?"checked":""} onchange="toggle('${jsq(f.company)}','replied',this.checked)"> Replied</label>
      <label class="chk"><input type="checkbox" ${s.closed?"checked":""} onchange="toggle('${jsq(f.company)}','closed',this.checked)"> Close / done</label>
    </div>
  </div>`;
}
window.toggle=function(name,key,val){ st(name)[key]=val; save(); render(); };
window.copy=copy;

function visible(f){
  const s=st(f.company);
  if(filterTier!=="all" && f.tier!==filterTier) return false;
  if(hideClosed && s.closed) return false;
  if(filterDue){ const st2=firmStatus(f); if(st2!=="f1due" && st2!=="f2due") return false; }
  return true;
}

function render(){
  renderTiles();
  const wrap=document.getElementById("groups"); let html="";
  TIERS.forEach(t=>{
    const fs=FIRMS.filter(f=>f.tier===t && visible(f));
    const total=FIRMS.filter(f=>f.tier===t).length;
    if(total===0) return;
    html+=`<div class="group-h">${TIERLABEL[t]} <span class="cnt">· ${fs.length} shown</span></div>`;
    html+= fs.length ? `<div class="cards">${fs.map(card).join("")}</div>` : `<div class="empty">None match the current filter.</div>`;
  });
  wrap.innerHTML=html||`<div class="empty">No firms match.</div>`;
}

// controls
document.getElementById("tierseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filterTier=b.dataset.tier;[...e.currentTarget.children].forEach(c=>c.setAttribute("aria-pressed",c===b));render();});
document.getElementById("duefilter").addEventListener("click",e=>{filterDue=!filterDue;e.currentTarget.setAttribute("aria-pressed",filterDue);render();});
document.getElementById("hideclosed").addEventListener("change",e=>{hideClosed=e.target.checked;render();});
const senderInput=document.getElementById("sender"); senderInput.value=sender;
senderInput.addEventListener("input",e=>{sender=e.target.value||DEFAULT_SENDER;localStorage.setItem(NKEY,e.target.value);});

// export / import
document.getElementById("exportbtn").addEventListener("click",()=>{
  const cols=["company_name","initial_sent","initial_date","fu1_sent","fu1_date","fu2_sent","fu2_date","replied","closed"];
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[cols.map(q).join(",")];
  FIRMS.forEach(f=>{const s=st(f.company);lines.push([f.company,s.i.s,s.i.d||"",s.f1.s,s.f1.d||"",s.f2.s,s.f2.d||"",s.replied,s.closed].map(q).join(","));});
  const blob=new Blob([lines.join("\n")],{type:"text/csv"});const u=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=u;a.download="outreach_progress_"+today()+".csv";a.click();URL.revokeObjectURL(u);toast("Progress exported");
});
document.getElementById("importbtn").addEventListener("click",()=>document.getElementById("importfile").click());
document.getElementById("importfile").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file)return; const r=new FileReader();
  r.onload=()=>{ try{
    const rows=parseCSV(r.result); const h=rows[0]; const idx=n=>h.indexOf(n); let imported=0;
    for(let i=1;i<rows.length;i++){ const row=rows[i]; if(!row.length||!row[idx("company_name")])continue;
      const name=row[idx("company_name")]; const s=st(name);
      const tb=v=>String(v).toLowerCase()==="true";
      s.i={s:tb(row[idx("initial_sent")]),d:row[idx("initial_date")]||null};
      s.f1={s:tb(row[idx("fu1_sent")]),d:row[idx("fu1_date")]||null};
      s.f2={s:tb(row[idx("fu2_sent")]),d:row[idx("fu2_date")]||null};
      s.replied=tb(row[idx("replied")]); s.closed=tb(row[idx("closed")]); imported++;
    }
    save(); render(); toast("Imported "+imported+" firms");
  }catch(err){ toast("Import failed — check the CSV format"); } };
  r.readAsText(file); e.target.value="";
});
function parseCSV(text){ const out=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"')q=true; else if(c===","){row.push(cur);cur="";} else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n")i++; row.push(cur);cur=""; if(row.length>1||row[0]!=="")out.push(row); row=[]; } else cur+=c; } }
  if(cur!==""||row.length){row.push(cur);out.push(row);} return out;
}
render();
</script>
