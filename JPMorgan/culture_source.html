<style>
  @page { size: A4; margin: 18mm 16mm 20mm 16mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 10.5pt; line-height: 1.45; color: #1a1a1a; }
  h1 { font-size: 26pt; margin: 0 0 6pt 0; color: #0b2a4a; line-height: 1.15; }

  h3 { font-size: 12.5pt; margin: 14pt 0 5pt 0; color: #0b2a4a; page-break-after: avoid; }

  .cover .meta { margin-top: 30pt; font-size: 9.5pt; color: #666; }
  .box { border: 1pt solid #cfd8e3; border-left: 4pt solid #0b2a4a; background: #f4f7fb; padding: 8pt 10pt; margin: 8pt 0 10pt 0; page-break-inside: avoid; }
  .box.gold { border-left-color: #b08d2f; background: #fbf7ec; }
  .box.red { border-left-color: #b03a2e; background: #fbf0ee; }

  th { background: #0b2a4a; color: #fff; font-weight: bold; }
  tr:nth-child(even) td { background: #f7f9fc; }
  .fig { margin: 8pt 0 10pt 0; page-break-inside: avoid; }
  .fig svg { width: 100%; height: auto; display: block; }
  .cap { font-size: 8.5pt; color: #555; margin-top: 3pt; }
  .two { display: flex; gap: 10pt; }
  .two > div { flex: 1; }

  .toc li { margin-bottom: 4pt; }
  .toc .n { color: #b08d2f; font-weight: bold; margin-right: 6pt; }
  .kw { font-weight: bold; color: #0b2a4a; }
  .num { font-family: Georgia, serif; font-size: 20pt; color: #0b2a4a; font-weight: bold; }
  .stat { display: inline-block; width: 31%; margin: 0 1% 8pt 0; vertical-align: top; border-top: 2pt solid #b08d2f; padding-top: 4pt; }
  .stat .l { font-size: 8.5pt; color: #555; }
  .check li { list-style: none; position: relative; padding-left: 16pt; }
  .check li:before { content: "\2610"; position: absolute; left: 0; top: 0; color: #0b2a4a; }
  .src { font-size: 8pt; color: #555; word-break: break-all; }
  .src li { margin-bottom: 2pt; }
  .pill { display: inline-block; background: #0b2a4a; color: #fff; padding: 1pt 6pt; border-radius: 8pt; font-size: 8.5pt; margin-right: 3pt; }
  .pill.g { background: #b08d2f; }
