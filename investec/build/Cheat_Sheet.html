<!doctype html><html><head><meta charset="utf-8"><title>Investec Cheat Sheet</title><style>:root{--navy:#0b1f3a;--navy2:#16325c;--ink:#1d2633;--muted:#5b6b82;--line:#d6dde8;--bg:#ffffff;--soft:#f3f6fa;
--accent:#d98e2b;--accentsoft:#fbf1e2;--signal:#7b3fa8;--signalsoft:#f3eaf9;--green:#2e7d4f;--greensoft:#e7f4ec;--red:#b23a3a;--redsoft:#fbeaea;--teal:#1f7a8c;--tealsoft:#e5f3f6;}
@page{size:A4;}
*{box-sizing:border-box}
html,body{background:#fff;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:9.6pt;line-height:1.45;margin:0}
h1,h2,h3,h4{color:var(--navy);font-weight:700;line-height:1.2;page-break-after:avoid;break-after:avoid}
h1{font-size:22pt;margin:0 0 6px}
h2{font-size:14pt;margin:18px 0 6px;border-bottom:2px solid var(--accent);padding-bottom:3px}
h3{font-size:11.2pt;margin:14px 0 4px}
h4{font-size:10pt;margin:10px 0 3px;color:var(--navy2)}
p{margin:0 0 7px}
ul,ol{margin:0 0 8px 18px;padding:0}
li{margin:0 0 3px}
a{color:var(--navy2);text-decoration:none}
.part{page-break-before:always;break-before:page}
.band{background:var(--navy);color:#fff;padding:14px 18px 12px;margin:0 0 12px;border-left:10px solid var(--accent)}
.band .num{font-size:9pt;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
.band h1{color:#fff;margin:2px 0 4px}
.band p{color:#d4dceb;margin:0;font-size:9.5pt}
.mk{color:#fff;font-size:1px;line-height:1px;height:1px;overflow:hidden;display:block}
table{border-collapse:collapse;width:100%;margin:6px 0 10px;font-size:8.3pt;page-break-inside:auto}
th{background:var(--navy);color:#fff;text-align:left;padding:4px 5px;font-weight:600;vertical-align:bottom}
td{border-bottom:1px solid var(--line);padding:3.5px 5px;vertical-align:top}
tr{page-break-inside:avoid;break-inside:avoid}
tr:nth-child(even) td{background:var(--soft)}
table.src{font-size:6.9pt}
table.src td{padding:2px 4px;word-break:break-word}
.box{border-radius:5px;padding:8px 11px 6px;margin:8px 0 10px;page-break-inside:avoid;break-inside:avoid;border-left:6px solid}
.box .lab{font-size:7.4pt;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px;display:block}
.term{background:var(--tealsoft);border-color:var(--teal)} .term .lab{color:var(--teal)}
.say{background:var(--greensoft);border-color:var(--green)} .say .lab{color:var(--green)}
.dont{background:var(--redsoft);border-color:var(--red)} .dont .lab{color:var(--red)}
.op{background:var(--signalsoft);border-color:var(--signal)} .op .lab{color:var(--signal)}
.unc{background:var(--accentsoft);border-color:var(--accent)} .unc .lab{color:#9a5e10}
.note{background:var(--soft);border-color:var(--navy2)} .note .lab{color:var(--navy2)}
.fig{margin:10px 0 12px;page-break-inside:avoid;break-inside:avoid;border:1px solid var(--line);border-radius:6px;padding:8px 8px 6px}
.fig .ft{font-weight:700;color:var(--navy);font-size:9.4pt;margin-bottom:4px}
.fig .ft span{color:var(--accent);margin-right:6px}
.fig svg{width:100%;height:auto;display:block}
.fig .fs{font-size:7pt;color:var(--muted);margin-top:4px;line-height:1.3}
.fullpage{page-break-before:always;break-before:page}
.c{font-size:6.8pt;font-weight:700;padding:0 3px;border-radius:3px;vertical-align:1px;white-space:nowrap}
.cC{background:var(--greensoft);color:var(--green)} .cR{background:var(--accentsoft);color:#9a5e10} .cI{background:var(--signalsoft);color:var(--signal)}
.s{font-size:7pt;color:var(--muted);vertical-align:1px;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0 0 9px;page-break-inside:avoid;break-inside:avoid;border-top:5px solid var(--navy2)}
.card.easy{border-top-color:var(--green)} .card.med{border-top-color:var(--accent)} .card.hard{border-top-color:var(--red)}
.card h4{margin:0 0 4px}
.card .tag{float:right;font-size:7pt;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.card.easy .tag{color:var(--green)} .card.med .tag{color:#9a5e10} .card.hard .tag{color:var(--red)}
.card dl{margin:0;display:grid;grid-template-columns:72px 1fr;gap:2px 8px;font-size:8.6pt}
.card dt{font-weight:700;color:var(--navy2)} .card dd{margin:0}
.cover{height:265mm;background:var(--navy);color:#fff;padding:28mm 18mm;position:relative;margin:-0mm}
.cover h1{color:#fff;font-size:34pt;margin:16mm 0 4mm;line-height:1.05}
.cover .k{color:var(--accent);letter-spacing:.2em;text-transform:uppercase;font-weight:700;font-size:10pt}
.cover .sub{color:#c9d3e6;font-size:12pt;max-width:150mm}
.cover .meta{position:absolute;bottom:22mm;left:18mm;right:18mm;font-size:9pt;color:#c9d3e6;border-top:1px solid #34507d;padding-top:6mm}
.toc{width:100%;font-size:9.4pt;border:none}
.toc td{border:none;padding:2.4px 2px;background:#fff!important}
.toc .pt td{font-weight:700;color:var(--navy);padding-top:6px}
.toc .tocpg{float:right}
.lead{font-size:10.4pt;color:var(--navy2)}
.small{font-size:8pt;color:var(--muted)}
.qa{border-bottom:1px dashed var(--line);padding:5px 0 6px;page-break-inside:avoid;break-inside:avoid}
.qa .q{font-weight:700;color:var(--navy)}
.qa .m{font-size:8.4pt}
.qa .m b{color:var(--navy2)}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:7.5pt;margin:0 3px 3px 0}
.news{border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:5px;padding:7px 10px;margin:0 0 8px;page-break-inside:avoid;break-inside:avoid}
.news .h{font-weight:700;color:var(--navy)}
.news .d{font-size:7.6pt;color:var(--muted);margin-bottom:3px}
.gl dt{font-weight:700;color:var(--navy);float:left;clear:left;width:118px}
.gl dd{margin:0 0 4px 124px;font-size:8.6pt}
.gl{column-count:1}
.avoid{page-break-inside:avoid;break-inside:avoid}

="66" font-size="10.5" fill="#fff" text-anchor="start" font-weight="bold"><tspan x="375" dy="0">PRIORITY ORDER</tspan></text><text x="377" y="90" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">1 Rules, confidentiality, Investec's name</tspan></text><text x="377" y="109" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">2 The client and team commitments</tspan></text><text x="377" y="128" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">3 Accuracy and the record</tspan></text><text x="377" y="147" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">4 Speed</tspan></text><text x="377" y="166" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">"Never trade integrity or accuracy for speed."</tspan></text><rect x="10" y="210" width="345" height="165" rx="6" fill="#fff" stroke="#16325c" stroke-width="1.6"/><rect x="10" y="210" width="345" height="22" rx="6" fill="#16325c" stroke="#16325c" stroke-width="1"/><text x="20" y="226" font-size="10.5" fill="#fff" text-anchor="start" font-weight="bold"><tspan x="20" dy="0">NUMBERS IF ASKED (FY26, to 31 Mar 26)</tspan></text><text x="22" y="250" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">Group adj. op. profit £951.0m (+3.4%)</tspan></text><text x="22" y="269" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">ROE 13.6% · C/I 52.9% · CLR 36bps</tspan></text><text x="22" y="288" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">NII 58.6% / non-interest 41.4%</tspan></text><text x="22" y="307" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">UK SB profit £401.6m; loans £17.8bn</tspan></text><text x="22" y="326" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">Investec plc RoTE 13.7%; CET1 13.0%</tspan></text><text x="22" y="345" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">IBP staff 2,425; group 8,000+</tspan></text><rect x="365" y="210" width="345" height="165" rx="6" fill="#fff" stroke="#d98e2b" stroke-width="1.6"/><rect x="365" y="210" width="345" height="22" rx="6" fill="#d98e2b" stroke="#d98e2b" stroke-width="1"/><text x="375" y="226" font-size="10.5" fill="#fff" text-anchor="start" font-weight="bold"><tspan x="375" dy="0">DATES</tspan></text><text x="377" y="250" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">Founded 1974 Jo'burg · DLC 2002</tspan></text><text x="377" y="269" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">Rathbones 2023 (41% econ / 29.9% votes)</tspan></text><text x="377" y="288" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">Bank Rate 3.75%; MPC 5 Nov</tspan></text><text x="377" y="307" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">Budget 28 Oct · Interims 19 Nov</tspan></text><text x="377" y="326" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">Basel 3.1 (PS1/26) from 1 Jan 2027</tspan></text><text x="377" y="345" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">FSCS £120k since 1 Dec 2025</tspan></text><rect x="10" y="385" width="345" height="160" rx="6" fill="#fff" stroke="#7b3fa8" stroke-width="1.6"/><rect x="10" y="385" width="345" height="22" rx="6" fill="#7b3fa8" stroke="#7b3fa8" stroke-width="1"/><text x="20" y="401" font-size="10.5" fill="#fff" text-anchor="start" font-weight="bold"><tspan x="20" dy="0">COUNTERS</tspan></text><text x="22" y="425" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">Interrupted: "Of course." Answer, then finish.</tspan></text><text x="22" y="444" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">Contradicted: "Which part?"</tspan></text><text x="22" y="463" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">Silence: wait; offer depth</tspan></text><text x="22" y="482" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">Authority squeeze: help + check first</tspan></text><text x="22" y="501" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">False choice: answer, then name option C</tspan></text><text x="22" y="520" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">Knowledge trap: "I don't know precisely; here's how I'd reason"</tspan></text><rect x="365" y="385" width="345" height="160" rx="6" fill="#fff" stroke="#b23a3a" stroke-width="1.6"/><rect x="365" y="385" width="345" height="22" rx="6" fill="#b23a3a" stroke="#b23a3a" stroke-width="1"/><text x="375" y="401" font-size="10.5" fill="#fff" text-anchor="start" font-weight="bold"><tspan x="375" dy="0">NEVER</tspan></text><text x="377" y="425" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">Claim "best" or "highest returns"</tspan></text><text x="377" y="444" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">Name Wealth &amp; Investment as a team</tspan></text><text x="377" y="463" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">Raise cum-ex or fines unprompted</tspan></text><text x="377" y="482" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">Quote the windfall tax as policy</tspan></text><text x="377" y="501" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">Send client data outside the bank</tspan></text><text x="377" y="520" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="377" dy="0">Bluff a number</tspan></text><rect x="10" y="555" width="700" height="105" rx="6" fill="#fff" stroke="#2e7d4f" stroke-width="1.6"/><rect x="10" y="555" width="700" height="22" rx="6" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1"/><text x="20" y="571" font-size="10.5" fill="#fff" text-anchor="start" font-weight="bold"><tspan x="20" dy="0">LINES READY</tspan></text><text x="22" y="595" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">"One bank for the founder and the company: private bank, mid-market lending, advisory and broking."</tspan></text><text x="22" y="614" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">"FY27 is the peak investment year: a new Corporate Bank and a full UK private bank. I'd join a build."</tspan></text><text x="22" y="633" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">"Material ownership, freedom to operate with accountability: that's what I want in eight weeks."</tspan></text><text x="22" y="652" font-size="9.6" fill="#0b1f3a" text-anchor="start" font-weight="normal"><tspan x="22" dy="0">ASK: "What would tell you by FY28 that the UK investments are working?"</tspan></text></svg><p class="small" style="margin-top:6px">Sources: S70, S120, S278, S282 (figures, Confirmed); S78, S80, S157, S176, S222, S230, S244 (dates). Full source table in Part 15 of the complete pack. Prepared 5 Oct 2026.</p></body></html>
