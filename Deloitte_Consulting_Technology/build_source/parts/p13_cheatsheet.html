<div>
<div class="cb"><h5>The protocol, in words</h5>
<p><b>1 Steady (0 to 8 s).</b> One slow breath out. Repeat the problem in one line. Ask one question only if a missing fact changes the answer.</p>
<p><b>2 Sort (8 to 25 s).</b> Say what is at stake and rank it on the ladder. Separate what you know from what you would need to find out.</p>
<p><b>3 Act (25 to 60 s).</b> The first concrete step, who you tell, and by when. Then the route that still meets the goal.</p>
<p><b>4 Close (60 to 75 s).</b> The outcome, the record you leave, the follow-up. Then stop.</p>
<p><i>Deloitte's Code calls its method ACT: Assess, Consider and Consult, Take action. "Speaking up is taking action!" [S340]</i></p></div>

<div class="cb r"><h5>The never list</h5>
<ul>
<li>Put client data into a public AI tool [S340, S345]</li>
<li>Send AI output you have not checked line by line [S347, S388]</li>
<li>Overstate your experience to a client [S340]</li>
<li>Move, pad or under-record hours [S340]</li>
<li>Make management decisions for a Deloitte audit client [S364]</li>
<li>Reuse one client's information for another, or tip anyone off [S340, S359]</li>
<li>Accept lavish hospitality during a live bid [S357]</li>
<li>Delete files when a matter may be investigated [S390]</li>
<li>Pass a failed test, or drop a red risk to please a sponsor [Inferred]</li>
<li>Use someone else's login, or keep access after you leave a project [S363]</li>
<li>Use AI in Deloitte's assessments or interviews [S351]</li>
</ul></div>
</div>
<div>
<div class="cb ac"><h5>Eight frame-breaks, and the counter</h5>
<p><i>After your first answer, the interviewer tests whether it holds. Keep the same priority order; change a step only for a new fact.</i></p>
<ol>
<li><b>Interruption.</b> Finish one sentence, then go where they lead. Do not restart the whole answer.</li>
<li><b>Flat contradiction.</b> Name the evidence that would change your view; keep the view if it is absent [S340].</li>
<li><b>Silence.</b> Count three seconds, then offer to go deeper on one part. Never retract to fill the gap.</li>
<li><b>Escalation.</b> Higher stakes mean a more senior person to consult, not a faster climb-down [S340].</li>
<li><b>Authority squeeze.</b> Agree the goal, decline the method, offer an alternative with a time.</li>
<li><b>False choice.</b> Name the third route: deliver part on time, flag the rest, raise it early.</li>
<li><b>Knowledge trap.</b> Say you do not know the detail, state the principle, say who you would check with [S340].</li>
<li><b>Invitation to badmouth.</b> Decline warmly. Talk only about what you did and would do differently.</li>
</ol></div>
<div class="cb g"><h5>Lines to have ready</h5>
<ul>
<li>"I'll keep it legal and honest first, do right by the client second, follow the process and leave a record third, and go as fast as those three allow."</li>
<li>"Let me confirm with my manager and come back to you by three o'clock."</li>
<li>"Here is what I know, what I do not know, and what I would do next."</li>
<li>"That is outside what we agreed. Let me log it and check how we fit it in." [S377]</li>
<li>"I would only use firm-approved AI tools and verify every source." [S3]</li>
<li>"I got that wrong. Here is the fix, and here is who I have told."</li>
</ul></div>

<div class="cb g"><h5>The 30-second why Deloitte</h5>
<p>"I want to start where the shape of the firm helps me learn. Deloitte keeps audit, tax, advisory and technology in one partnership. In FY25 T&amp;T revenue fell 10%, but the firm fell only 1% [S89, S305]. That stability pays for £180m of technology investment and a new Chief AI Officer [S407]. In FY26 T&amp;T was the fastest-growing UK business, on ERP, cyber and human capital work. That is the work I want to learn." [S407]</p></div>
