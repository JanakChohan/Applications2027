<figure><svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img"><rect x="190.0" y="8" width="300" height="50" rx="4" fill="#B23A3A" stroke="#B23A3A" stroke-width="1.2"/><text x="340.0" y="24.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif">1. The rules and Schroders&#x27; name</text><text x="340.0" y="39.3" font-size="9.5" fill="#fff" text-anchor="middle" font-family="'Source Sans 3',Arial,sans-serif">Regulation, approvals, confidentiality, inside information.</text><text x="340.0" y="50.7" font-size="9.5" fill="#fff" text-anchor="middle" font-family="'Source Sans 3',Arial,sans-serif">Never traded for anything below.</text><rect x="150.0" y="66" width="380" height="50" rx="4" fill="#2A62B0" stroke="#2A62B0" stroke-width="1.2"/><text x="340.0" y="82.3" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif">2. The client&#x27;s real interest</text><text x="340.0" y="97.3" font-size="9.5" fill="#fff" text-anchor="middle" font-family="'Source Sans 3',Arial,sans-serif">Good outcomes, fair treatment, honest answers. Consumer Duty makes this a rule</text><text x="340.0" y="108.7" font-size="9.5" fill="#fff" text-anchor="middle" font-family="'Source Sans 3',Arial,sans-serif">for retail clients.</text><rect x="110.0" y="124" width="460" height="50" rx="4" fill="#1B9E8A" stroke="#1B9E8A" stroke-width="1.2"/><text x="340.0" y="146.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif">3. Fair service to every colleague, the process and the record</text><text x="340.0" y="161.0" font-size="9.5" fill="#fff" text-anchor="middle" font-family="'Source Sans 3',Arial,sans-serif">Nobody jumps the queue by volume or rank. Log it, tell people early.</text><rect x="70.0" y="182" width="540" height="50" rx="4" fill="#C8813A" stroke="#C8813A" stroke-width="1.2"/><text x="340.0" y="204.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif">4. Speed</text><text x="340.0" y="219.0" font-size="9.5" fill="#fff" text-anchor="middle" font-family="'Source Sans 3',Arial,sans-serif">As fast as possible inside 1 to 3. Speed is the variable you flex.</text><text x="340" y="256" font-size="10.5" fill="#4A4F5A" text-anchor="middle" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="340" dy="0.0">The one sentence that holds every frame:</tspan></text><text x="340" y="274" font-size="11" fill="#7A3E9D" text-anchor="middle" font-weight="600" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="340" dy="0.0">&quot;I won&#x27;t trade the rules or the client&#x27;s interest for speed. Inside those, I&#x27;ll be as fast and as helpful as I</tspan><tspan x="340" dy="13.8">can, and I&#x27;ll tell people early.&quot;</tspan></text></svg><figcaption><b>Figure #.</b> Priority order when good things collide in a Client Group seat. Built by the author from the JD and the FCA rules in Part 6 [Inferred].</figcaption></figure>
