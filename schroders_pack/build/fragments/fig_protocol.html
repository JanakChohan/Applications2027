<figure><svg viewBox="0 0 680 256" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4F5A"/></marker><marker id="aap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8813A"/></marker></defs><rect x="6" y="10" width="158" height="210" rx="5" fill="#fff" stroke="#2A62B0" stroke-width="2"/><rect x="6" y="10" width="158" height="36" rx="5" fill="#2A62B0"/><rect x="6" y="40" width="158" height="6" fill="#2A62B0"/><text x="16" y="33" font-size="13" fill="#fff" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="16" dy="0.0">1  STEADY</tspan></text><text x="16" y="64" font-size="10" fill="#2A62B0" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="16" dy="0.0">0 to 5 s</tspan></text><text x="16" y="84" font-size="10.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="16" dy="0.0">Breathe out. Repeat the</tspan><tspan x="16" dy="13.1">core of the question.</tspan></text><text x="16" y="146" font-size="9.5" fill="#4A4F5A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="16" dy="0.0">&quot;So the client is unhappy</tspan><tspan x="16" dy="11.9">about the report, and wants</tspan><tspan x="16" dy="11.9">an answer today.&quot;</tspan></text><line x1="166" y1="115" x2="176" y2="115" stroke="#4A4F5A" stroke-width="1.4" marker-end="url(#arp)"/><rect x="176" y="10" width="158" height="210" rx="5" fill="#fff" stroke="#1B9E8A" stroke-width="2"/><rect x="176" y="10" width="158" height="36" rx="5" fill="#1B9E8A"/><rect x="176" y="40" width="158" height="6" fill="#1B9E8A"/><text x="186" y="33" font-size="13" fill="#fff" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="186" dy="0.0">2  SORT</tspan></text><text x="186" y="64" font-size="10" fill="#1B9E8A" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="186" dy="0.0">5 to 20 s</tspan></text><text x="186" y="84" font-size="10.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="186" dy="0.0">Name what collides and</tspan><tspan x="186" dy="13.1">apply the priority order.</tspan></text><text x="186" y="146" font-size="9.5" fill="#4A4F5A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="186" dy="0.0">&quot;Two things matter here: the</tspan><tspan x="186" dy="11.9">rules on what I can send, and</tspan><tspan x="186" dy="11.9">the client&#x27;s deadline.&quot;</tspan></text><line x1="336" y1="115" x2="346" y2="115" stroke="#4A4F5A" stroke-width="1.4" marker-end="url(#arp)"/><rect x="346" y="10" width="158" height="210" rx="5" fill="#fff" stroke="#C8813A" stroke-width="2"/><rect x="346" y="10" width="158" height="36" rx="5" fill="#C8813A"/><rect x="346" y="40" width="158" height="6" fill="#C8813A"/><text x="356" y="33" font-size="13" fill="#fff" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="356" dy="0.0">3  ACT</tspan></text><text x="356" y="64" font-size="10" fill="#C8813A" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="356" dy="0.0">20 to 55 s</tspan></text><text x="356" y="84" font-size="10.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="356" dy="0.0">Say what you would do, in</tspan><tspan x="356" dy="13.1">order, and who you&#x27;d tell.</tspan></text><text x="356" y="146" font-size="9.5" fill="#4A4F5A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="356" dy="0.0">&quot;First I&#x27;d tell my manager,</tspan><tspan x="356" dy="11.9">then I&#x27;d chase approval, then</tspan><tspan x="356" dy="11.9">I&#x27;d update the client with a</tspan><tspan x="356" dy="11.9">time.&quot;</tspan></text><line x1="506" y1="115" x2="516" y2="115" stroke="#4A4F5A" stroke-width="1.4" marker-end="url(#arp)"/><rect x="516" y="10" width="158" height="210" rx="5" fill="#fff" stroke="#7A3E9D" stroke-width="2"/><rect x="516" y="10" width="158" height="36" rx="5" fill="#7A3E9D"/><rect x="516" y="40" width="158" height="6" fill="#7A3E9D"/><text x="526" y="33" font-size="13" fill="#fff" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="526" dy="0.0">4  CLOSE</tspan></text><text x="526" y="64" font-size="10" fill="#7A3E9D" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="526" dy="0.0">55 to 75 s</tspan></text><text x="526" y="84" font-size="10.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="526" dy="0.0">State the principle and the</tspan><tspan x="526" dy="13.1">outcome. Stop talking.</tspan></text><text x="526" y="146" font-size="9.5" fill="#4A4F5A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="526" dy="0.0">&quot;That way the client gets it</tspan><tspan x="526" dy="11.9">fast and gets it right.&quot;</tspan></text><text x="340" y="246" font-size="10" fill="#4A4F5A" text-anchor="middle" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="340" dy="0.0">Total: 45 to 75 seconds. Longer than 90 seconds and you lose the room; shorter than 30 and you skipped a step.</tspan></text></svg><figcaption><b>Figure #.</b> The four-step answer protocol for any scenario. Timings are a coaching heuristic built for this pack [Inferred], not a Schroders rule.</figcaption></figure>
