<figure><svg viewBox="0 0 680 376" xmlns="http://www.w3.org/2000/svg" role="img"><rect x="6" y="6" width="330" height="84" rx="4" fill="#fff" stroke="#C9CED6"/><rect x="6" y="6" width="6" height="84" rx="2" fill="#B23A3A"/><text x="20" y="23" font-size="11.5" fill="#0B1F3A" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="20" dy="0.0">1. Interruption</tspan></text><text x="20" y="39" font-size="9.5" fill="#B23A3A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="20" dy="0.0">They cut in mid-answer.</tspan></text><text x="20" y="56" font-size="9.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="20" dy="0.0">Stop. &quot;Sure.&quot; Answer the new point in one line, then: &quot;To finish</tspan><tspan x="20" dy="11.9">my first point...&quot;</tspan></text><rect x="344" y="6" width="330" height="84" rx="4" fill="#fff" stroke="#C9CED6"/><rect x="344" y="6" width="6" height="84" rx="2" fill="#B23A3A"/><text x="358" y="23" font-size="11.5" fill="#0B1F3A" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="358" dy="0.0">2. Flat contradiction</tspan></text><text x="358" y="39" font-size="9.5" fill="#B23A3A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="358" dy="0.0">&quot;That&#x27;s wrong.&quot;</tspan></text><text x="358" y="56" font-size="9.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="358" dy="0.0">&quot;Tell me more.&quot; If they&#x27;re right, update. If not: &quot;I see it</tspan><tspan x="358" dy="11.9">differently, because...&quot;</tspan></text><rect x="6" y="98" width="330" height="84" rx="4" fill="#fff" stroke="#C9CED6"/><rect x="6" y="98" width="6" height="84" rx="2" fill="#B23A3A"/><text x="20" y="115" font-size="11.5" fill="#0B1F3A" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="20" dy="0.0">3. Silence</tspan></text><text x="20" y="131" font-size="9.5" fill="#B23A3A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="20" dy="0.0">They say nothing after you finish.</tspan></text><text x="20" y="148" font-size="9.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="20" dy="0.0">Don&#x27;t fill it with a new answer. Wait three seconds, then:</tspan><tspan x="20" dy="11.9">&quot;Would it help if I went deeper on any part?&quot;</tspan></text><rect x="344" y="98" width="330" height="84" rx="4" fill="#fff" stroke="#C9CED6"/><rect x="344" y="98" width="6" height="84" rx="2" fill="#B23A3A"/><text x="358" y="115" font-size="11.5" fill="#0B1F3A" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="358" dy="0.0">4. Escalation</tspan></text><text x="358" y="131" font-size="9.5" fill="#B23A3A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="358" dy="0.0">&quot;And now the client threatens to leave.&quot;</tspan></text><text x="358" y="148" font-size="9.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="358" dy="0.0">Same priority order, bigger stakes. Escalate to your manager</tspan><tspan x="358" dy="11.9">sooner, not the rules later.</tspan></text><rect x="6" y="190" width="330" height="84" rx="4" fill="#fff" stroke="#C9CED6"/><rect x="6" y="190" width="6" height="84" rx="2" fill="#B23A3A"/><text x="20" y="207" font-size="11.5" fill="#0B1F3A" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="20" dy="0.0">5. Authority squeeze</tspan></text><text x="20" y="223" font-size="9.5" fill="#B23A3A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="20" dy="0.0">&quot;The MD says just do it.&quot;</tspan></text><text x="20" y="240" font-size="9.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="20" dy="0.0">&quot;I&#x27;ll do it the moment it&#x27;s approved, and I&#x27;ll chase approval</tspan><tspan x="20" dy="11.9">now.&quot; Rank doesn&#x27;t change the rule.</tspan></text><rect x="344" y="190" width="330" height="84" rx="4" fill="#fff" stroke="#C9CED6"/><rect x="344" y="190" width="6" height="84" rx="2" fill="#B23A3A"/><text x="358" y="207" font-size="11.5" fill="#0B1F3A" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="358" dy="0.0">6. False choice</tspan></text><text x="358" y="223" font-size="9.5" fill="#B23A3A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="358" dy="0.0">&quot;Break the rule or lose the client?&quot;</tspan></text><text x="358" y="240" font-size="9.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="358" dy="0.0">Find the third door: &quot;Neither. I&#x27;d tell the client when they&#x27;ll</tspan><tspan x="358" dy="11.9">get it, and get it approved fast.&quot;</tspan></text><rect x="6" y="282" width="330" height="84" rx="4" fill="#fff" stroke="#C9CED6"/><rect x="6" y="282" width="6" height="84" rx="2" fill="#B23A3A"/><text x="20" y="299" font-size="11.5" fill="#0B1F3A" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="20" dy="0.0">7. Knowledge trap</tspan></text><text x="20" y="315" font-size="9.5" fill="#B23A3A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="20" dy="0.0">A fact question you can&#x27;t answer.</tspan></text><text x="20" y="332" font-size="9.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="20" dy="0.0">&quot;I don&#x27;t know that figure. Here&#x27;s how I&#x27;d find it, and here&#x27;s</tspan><tspan x="20" dy="11.9">what I do know.&quot;</tspan></text><rect x="344" y="282" width="330" height="84" rx="4" fill="#fff" stroke="#C9CED6"/><rect x="344" y="282" width="6" height="84" rx="2" fill="#B23A3A"/><text x="358" y="299" font-size="11.5" fill="#0B1F3A" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="358" dy="0.0">8. Invitation to badmouth</tspan></text><text x="358" y="315" font-size="9.5" fill="#B23A3A" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif" font-style="italic"><tspan x="358" dy="0.0">&quot;Isn&#x27;t [rival / old boss] a bit useless?&quot;</tspan></text><text x="358" y="332" font-size="9.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="358" dy="0.0">Stay generous and specific: &quot;They do X well. What I&#x27;d do</tspan><tspan x="358" dy="11.9">differently is...&quot;</tspan></text></svg><figcaption><b>Figure #.</b> Eight ways assessors break a frame, with the counter to each. Author's synthesis of common interview practice [Inferred].</figcaption></figure>
