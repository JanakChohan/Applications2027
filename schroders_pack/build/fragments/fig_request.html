<figure><svg viewBox="0 0 680 346" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="arrq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4F5A"/></marker><marker id="aarq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8813A"/></marker></defs><rect x="10" y="6" width="190" height="40" rx="4" fill="#2A62B0"/><text x="22" y="31" font-size="12" fill="#fff" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="22" dy="0.0">1. Request arrives</tspan></text><text x="214" y="31" font-size="10.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="214" dy="0.0">RM: &quot;client wants Q3 performance and a view on gilts by 3pm&quot;</tspan></text><line x1="105" y1="46" x2="105" y2="54" stroke="#4A4F5A" stroke-width="1.4" marker-end="url(#arrq)"/><rect x="10" y="56" width="190" height="40" rx="4" fill="#D9822B"/><text x="22" y="81" font-size="12" fill="#fff" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="22" dy="0.0">2. Clarify</tspan></text><text x="214" y="81" font-size="10.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="214" dy="0.0">which fund, share class, period, audience (professional or retail)?</tspan></text><line x1="105" y1="96" x2="105" y2="104" stroke="#4A4F5A" stroke-width="1.4" marker-end="url(#arrq)"/><rect x="10" y="106" width="190" height="40" rx="4" fill="#1B9E8A"/><text x="22" y="131" font-size="12" fill="#fff" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="22" dy="0.0">3. Source</tspan></text><text x="214" y="131" font-size="10.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="214" dy="0.0">approved performance from the data team; house view from published insights</tspan></text><line x1="105" y1="146" x2="105" y2="154" stroke="#4A4F5A" stroke-width="1.4" marker-end="url(#arrq)"/><rect x="10" y="156" width="190" height="40" rx="4" fill="#B23A3A"/><text x="22" y="181" font-size="12" fill="#fff" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="22" dy="0.0">4. Check</tspan></text><text x="214" y="181" font-size="10.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="214" dy="0.0">labels, disclaimers, is anything new? If yes, compliance approval</tspan></text><line x1="105" y1="196" x2="105" y2="204" stroke="#4A4F5A" stroke-width="1.4" marker-end="url(#arrq)"/><rect x="10" y="206" width="190" height="40" rx="4" fill="#2A62B0"/><text x="22" y="231" font-size="12" fill="#fff" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="22" dy="0.0">5. Send</tspan></text><text x="214" y="231" font-size="10.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="214" dy="0.0">via the RM, on time; state any gap honestly</tspan></text><line x1="105" y1="246" x2="105" y2="254" stroke="#4A4F5A" stroke-width="1.4" marker-end="url(#arrq)"/><rect x="10" y="256" width="190" height="40" rx="4" fill="#8E4FB8"/><text x="22" y="281" font-size="12" fill="#fff" text-anchor="start" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="22" dy="0.0">6. Record</tspan></text><text x="214" y="281" font-size="10.5" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="214" dy="0.0">log in Salesforce; note follow-up; close the loop with the RM</tspan></text><rect x="10" y="306" width="660" height="34" rx="4" fill="#F9E7E7" stroke="#B23A3A" stroke-width="1.2"/><text x="34
