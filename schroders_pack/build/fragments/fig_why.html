<figure><svg viewBox="0 0 680 332" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="arwy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4F5A"/></marker><marker id="aawy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8813A"/></marker></defs><rect x="210" y="6" width="260" height="44" rx="4" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1.2"/><text x="340.0" y="32.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif">Why Schroders, Client Group, now</text><line x1="340" y1="50" x2="113" y2="70" stroke="#7A808C" stroke-width="1" marker-end="url(#arwy)"/><rect x="4" y="72" width="218" height="200" rx="4" fill="#fff" stroke="#D9822B" stroke-width="2"/><rect x="4" y="72" width="218" height="28" rx="4" fill="#D9822B"/><text x="113" y="91" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="113" dy="0.0">STRUCTURE</tspan></text><text x="14" y="120" font-size="9.8" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="14" dy="0.0">One central Client Group owns sales,</tspan><tspan x="14" dy="12.2">service, product, marketing [S306]</tspan></text><text x="14" y="172" font-size="9.8" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="14" dy="0.0">Refocused in 2025 on &quot;fewer core</tspan><tspan x="14" dy="12.2">propositions&quot; [S72]</tspan></text><text x="14" y="224" font-size="9.8" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="14" dy="0.0">Three pillars: Value Proposition, Sales</tspan><tspan x="14" dy="12.2">Activation, Delivery [S263]</tspan></text><line x1="340" y1="50" x2="339" y2="70" stroke="#7A808C" stroke-width="1" marker-end="url(#arwy)"/><rect x="230" y="72" width="218" height="200" rx="4" fill="#fff" stroke="#2A62B0" stroke-width="2"/><rect x="230" y="72" width="218" height="28" rx="4" fill="#2A62B0"/><text x="339" y="91" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="339" dy="0.0">ECONOMICS</tspan></text><text x="240" y="120" font-size="9.8" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="240" dy="0.0">Margins from 6bp (core solutions) to</tspan><tspan x="240" dy="12.2">57bp (private markets) [S71]</tspan></text><text x="240" y="172" font-size="9.8" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="240" dy="0.0">So the mix Client Group sells drives</tspan><tspan x="240" dy="12.2">revenue, not just AUM</tspan></text><text x="240" y="224" font-size="9.8" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="240" dy="0.0">Intermediary gross inflows up 40%+ in H1</tspan><tspan x="240" dy="12.2">2026 [S70]</tspan></text><line x1="340" y1="50" x2="565" y2="70" stroke="#7A808C" stroke-width="1" marker-end="url(#arwy)"/><rect x="456" y="72" width="218" height="200" rx="4" fill="#fff" stroke="#7A3E9D" stroke-width="2"/><rect x="456" y="72" width="218" height="28" rx="4" fill="#7A3E9D"/><text x="565" y="91" font-size="12" fill="#fff" text-anchor="middle" font-weight="700" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="565" dy="0.0">MOMENT</tspan></text><text x="466" y="120" font-size="9.8" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="466" dy="0.0">Nuveen completes 1 Oct 2026: ~$2.5trn,</tspan><tspan x="466" dy="12.2">London the non-US HQ [S75, S76]</tspan></text><text x="466" y="172" font-size="9.8" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="466" dy="0.0">Brand kept; standalone at least 12</tspan><tspan x="466" dy="12.2">months [S76]</tspan></text><text x="466" y="224" font-size="9.8" fill="#1B1B1F" text-anchor="start" font-weight="400" font-family="'Source Sans 3',Arial,sans-serif"><tspan x="466" dy="0.0">Client Group gets a bigger</tspan><tspan x="466" dy="12.2">public-to-private shelf to sell</tspan><tspan x="466" dy="12.2">[Inferred]</tspan></text><rect x="4" y="282" width="672" height="44" rx="4" fill="#FBF1E6" stroke="#C8813A" stroke-width="1.2"/><text x="340.0" y="301.5" font-size="10" fill="#1B1B1F" text-anchor="middle" font-weight="600" font-family="'Source Sans 3',Arial,sans-serif">Close: &quot;The thing I most want to work on is how a proposition like the Mercer LTAF goes from an idea with the investment team to</text><text x="340.0" y="313.5" font-size="10" fill="#1B1B1F" text-anchor="middle" font-weight="600" font-family="'Source Sans 3',Arial,sans-serif">a mandate, and what Sales Activation learns from the client that shapes the next one.&quot;</text></svg><figcaption><b>Figure #.</b> "Why Schroders" on one page: structure, economics, moment, and a specific close. Each fact sourced in the box; the argument is the author's [Inferred].</figcaption></figure>
